<main class="user-detail container py-4">
  <article class="user-detail__card">
    @if (usuario(); as user) {
      <div class="user-detail__image-wrapper">
        <img
          class="user-detail__image"
          [src]="user.image"
          [alt]="'Fotografía de ' + user.first_name + ' ' + user.last_name"
        />
      </div>

      <div class="user-detail__content">
        <h1>{{ user.first_name }}</h1>
        <h2>{{ user.last_name }}</h2>

        <dl class="user-detail__data">
          <div>
            <dt>Nombre Usuario:</dt>
            <dd>{{ user.username }}</dd>
          </div>
          <div>
            <dt>ID:</dt>
            <dd>{{ user.id }}</dd>
          </div>
          <div>
            <dt>Email:</dt>
            <dd>{{ user.email }}</dd>
          </div>
        </dl>

        <div class="user-detail__actions" aria-label="Acciones del usuario">
          <button type="button">Eliminar</button>
          <a href="/formulario-usuario">Actualizar</a>
          <a href="/home">Volver al listado</a>
        </div>
      </div>
    }
  </article>
</main>
